[package]
name = "maul-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Maul Street on NEAR: every beast, relic and stake in one NEP-245 contract that also referees the fights."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
maul-core = { path = "../core" }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[package.metadata.near.wasm-opt]
enabled = true
