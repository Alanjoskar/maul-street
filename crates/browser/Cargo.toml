[package]
name = "maul-browser"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The same rules the contract runs, compiled for the browser: offline practice, stat previews and price reasoning."

[lib]
crate-type = ["cdylib"]

[dependencies]
maul-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
