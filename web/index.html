<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maul Street</title>
    <meta name="description" content="A 3D beast-fighting pit on NEAR. Send in three, fight for testnet NEAR, hire out your champions." />
    <meta name="theme-color" content="#0b0907" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b0907'/%3E%3Cpath d='M10 50 L20 14 L32 38 L44 14 L54 50 L44 50 L40 32 L32 50 L24 32 L20 50Z' fill='%23c8102e'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0907; overflow: hidden; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud, #ui { position: fixed; inset: 0; }
      #ui { z-index: 2; }
      /* The fight screen sits above the menus, and the menus go away while a fight is on. */
      #hud { z-index: 3; pointer-events: none; }
      body.in-fight #ui { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
