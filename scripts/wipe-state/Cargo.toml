[package]
name = "wipe-state"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A one-method contract that deletes storage keys, so Maul Street can be redeployed onto clean state."

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"

# A tool on its own, not a member of the game's workspace.
[workspace]
